<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BODA - Edgar y Jhoana</title>

    <!-- Iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('fondo_boda2.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #fff;
        }

        /* Capa oscura para mejor lectura */
        .overlay {
            background: rgba(0,0,0,0.55);
            min-height: 100vh;
            padding: 20px;
            border-radius: 15px;
        }

        h1 {
            margin-top: 10px;
            letter-spacing: 2px;
        }

        p {
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .photo {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .photo img {
            width: 100%;
            display: block;
        }

        /* Botón de descarga */
        .download {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.65);
            padding: 8px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .download:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
<div class="overlay">

    <h1>BODA - Edgar y Jhoana</h1>
    <p>Galería de fotos</p>

    <div class="gallery">

        <!-- 53 imágenes con botón de descarga -->
        <div class="photo">
            <a class="download" href="Kuti_PRO1.jpeg" download><i class="fa-solid fa-download"></i></a>
            <img src="Kuti_PRO1.jpeg">
        </div>

        <div class="photo">
            <a class="download" href="Kuti_PRO2.jpeg" download><i class="fa-solid fa-download"></i></a>
            <img src="Kuti_PRO2.jpeg">
        </div>

        <div class="photo">
            <a class="download" href="Kuti_PRO3.jpeg" download><i class="fa-solid fa-download"></i></a>
            <img src="Kuti_PRO3.jpeg">
        </div>

        <!-- REPITE EL MISMO PATRÓN PARA TODAS -->

        <!-- EJEMPLO FINAL -->
        <div class="photo">
            <a class="download" href="Kuti_PRO53.jpeg" download><i class="fa-solid fa-download"></i></a>
            <img src="Kuti_PRO53.jpeg">
        </div>

    </div>

</div>
</body>
</html>
